buildscript {
    ext.kotlin_version = rootProject.ext.has('kotlinVersion') ? rootProject.ext.kotlinVersion : '1.9.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
// AGP 9 ships built-in Kotlin support and registers the `kotlin` extension
// itself. Applying the Kotlin plugin on top of it fails configuration with
// "Cannot add extension with name 'kotlin'". Only apply it when nothing has
// registered that extension yet.
def cohorlyBuiltInKotlin = project.extensions.findByName('kotlin') != null
if (!cohorlyBuiltInKotlin) {
    apply plugin: 'kotlin-android'
}

android {
    namespace "com.cohorly.reactnative"
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        // Session replay (VEL-2142): Compose rules for the recorder copy.
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// `android.kotlinOptions` is added by the kotlin-android plugin, so it does not
// exist with AGP's built-in Kotlin; there the target goes through
// `kotlin.compilerOptions`.
if (cohorlyBuiltInKotlin) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
} else {
    android {
        kotlinOptions {
            jvmTarget = "17"
        }
    }
}

repositories {
    google()
    mavenCentral()
    // Real (non-vendored) dependency on the Cohorly Android SDK, published via
    // JitPack from https://github.com/cohorly-io/cohorly-android (see that
    // repo's tag v0.4.0, whose crash reporter stamps the replay session id).
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'com.facebook.react:react-native:+'
    // Brings AndroidDeviceInfo (app version/build/model/manufacturer/brand/
    // carrier reads) - transitively pulls cohorly-android-core.
    implementation 'com.github.cohorly-io.cohorly-android:cohorly-android:v0.4.0'
    // Session replay (VEL-2142): the recorder copy under com/cohorly/android/replay
    // follows windows and touches through curtains (same version as
    // sdks/android/cohorly-replay), and reads Compose only when the app has it.
    implementation 'com.squareup.curtains:curtains:1.2.5'
    compileOnly 'androidx.compose.ui:ui:1.0.0'
}
